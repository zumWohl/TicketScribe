name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Mask-verify (destructive redaction test)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build renderer/main/preload (Vite)
        run: npm run build:vite

      - name: Package (--dir, unpacked)
        run: npx electron-builder --dir

      - name: Playwright e2e (legacy baseline + ported main + packaged smoke)
        run: npx playwright test

      - name: Upload --dir build output
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: dist/win-unpacked
