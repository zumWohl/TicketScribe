appId: com.cardonet.ticketscribe
productName: TicketScribe
asar: false
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: TicketScribe
nsis:
  oneClick: true
  perMachine: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
